<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | UES San José del Rincón</title>
    <!-- Fuentes -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;800;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style_admin_dashboard.css">
</head>
<body>
    <!-- BARRA DE NAVEGACIÓN -->
    <nav class="navbar">
        <div class="nav-links">
            <a href="/admin/sesiones" class="navbar-brand">Sesiones</a>
            
            <a href="#" class="navbar-brand" data-page="usuarios">Usuarios</a>
        </div>
        <div class="user-section">
            <button class="theme-toggle" id="themeToggle">
                <i class="fas fa-moon"></i>
            </button>
            <div class="user-info">
                <div class="user-avatar">
                    <i class="fas fa-user"></i>
                </div>
                <span class="user-name" id="adminName">ADMIN</span>
            </div>
            <button class="logout-btn" id="logoutBtn" title="Cerrar sesión">
                <i class="fas fa-sign-out-alt"></i>
            </button>
        </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="main-container">
        <h1 class="page-title">Gestión de la jornada académica y cultural</h1>

        <div class="content-grid">
            <!-- Recuadro de la imagen -->
            <div class="image-card">
                <img src="/static/img/umb1.jpg" 
                     alt="Universidad San José del Rincón" 
                     class="university-image"
                     onerror="this.src='https://placehold.co/875x477/1a3a2a/white?text=UES+San+Jos%C3%A9+del+Rinc%C3%B3n'">
            </div>

            <!-- Recuadro de total de sesiones -->
            <div class="stats-card">
                <div class="stats-title">
                    <i class="fas fa-calendar-alt" style="color: #D0A612; margin-right: 8px;"></i>
                    Total de sesiones registradas
                </div>
                <div class="stats-number" id="totalSesiones"></div>
                <div class="stats-label">Sesiones activas en el sistema</div>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="footer">
        <strong>© 2026 UES San José del Rincón</strong>
        <p>Gestión de la jornada académica y cultural<br>Todos los derechos reservados.</p>
    </footer>
    
<script src="/static/js/nocturno.js"></script>
</body>
</html>
